name: Test name input is required
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create event payload file
        run: |
          mkdir -p /tmp/event
          echo '{"action":"push"}' > /tmp/event/event.json
          echo "GITHUB_EVENT_PATH=/tmp/event/event.json" >> "$GITHUB_ENV"

      - name: Run action with a specific name value
        id: action
        uses: .
        continue-on-error: true
        with:
          name: my-test-name
          token: fake-token-for-testing
        env:
          GITHUB_REPOSITORY: octocat/hello-world
          GITHUB_SHA: abc1234567890abcdef1234567890abcdef12345
          GITHUB_EVENT_PATH: /tmp/event/event.json

      - name: Assert action was not skipped
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with name input (outcome: ${{ steps.action.outcome }})"
