name: Test name input processing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: octocat/hello-world
      GITHUB_SHA: abc1234def5678901234567890123456789012345
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create event payload file
        run: |
          echo '{"action":"push"}' > /tmp/event.json

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: /tmp/event.json
        with:
          name: TypeScript Action
          token: fake-token-for-testing

      - name: Assert action ran with name input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action accepts the name input and logs it before making API calls.
          # In act without a real token, the API call will fail, so outcome may be 'failure'.
          # What matters is the action ran (not skipped) and processed the name input.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with name='TypeScript Action', outcome=$OUTCOME"
