name: Test missing required name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: actions/checkout
      GITHUB_SHA: de0fac2e4500dabe0009e67214ff5f5447ce83dd
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create event payload file
        run: |
          mkdir -p /tmp/act-events
          echo '{"action":"push"}' > /tmp/act-events/event.json
          echo "GITHUB_EVENT_PATH=/tmp/act-events/event.json" >> $GITHUB_ENV

      - id: action
        uses: .
        # name is required but not provided — action should fail
        with:
          name: ''
          token: fake-token-for-testing
        continue-on-error: true

      - name: Assert action failed when name is empty
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when name is empty, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when name input is empty"
