name: Test missing required name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: octocat/hello-world
      GITHUB_SHA: abc1234def5678901234567890123456789012345
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake event payload
        run: |
          echo '{}' > /tmp/event.json
          echo "GITHUB_EVENT_PATH=/tmp/event.json" >> "$GITHUB_ENV"

      - name: Run action without required name input
        id: action
        uses: .
        with:
          # name is intentionally omitted — it is required: true
          token: fake-token-for-testing
        continue-on-error: true

      - name: Assert action failed due to missing required input
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when required 'name' input is missing, got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed when required 'name' input was missing"
