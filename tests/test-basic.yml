name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-act
      GITHUB_REPOSITORY: octocat/hello-world
      GITHUB_SHA: abc1234567890abcdef1234567890abcdef12345
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create event payload file
        run: |
          echo '{"action":"push"}' > /tmp/event.json
          echo "GITHUB_EVENT_PATH=/tmp/event.json" >> $GITHUB_ENV

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: "hello-world"
          token: fake-token-for-act
        env:
          GITHUB_TOKEN: fake-token-for-act
          GITHUB_REPOSITORY: octocat/hello-world
          GITHUB_SHA: abc1234567890abcdef1234567890abcdef12345
          GITHUB_EVENT_PATH: /tmp/event.json

      - name: Assert action ran
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          # The action makes a real GitHub API call which will fail with a fake token.
          # We verify the action at least started and ran (outcome is success or failure,
          # not skipped or cancelled).
          outcome="${{ steps.action.outcome }}"
          if [ "$outcome" = "skipped" ] || [ "$outcome" = "cancelled" ]; then
            echo "FAIL: action was skipped or cancelled, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$outcome"
