name: Test missing required environment variable
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create event payload file
        run: |
          mkdir -p /tmp/event
          echo '{"action":"push"}' > /tmp/event/event.json
          echo "GITHUB_EVENT_PATH=/tmp/event/event.json" >> "$GITHUB_ENV"

      - name: Run action without GITHUB_REPOSITORY (should fail)
        id: action
        uses: .
        continue-on-error: true
        with:
          name: test-name
          token: fake-token-for-testing
        env:
          GITHUB_REPOSITORY: ""
          GITHUB_SHA: abc1234567890abcdef1234567890abcdef12345
          GITHUB_EVENT_PATH: /tmp/event/event.json

      - name: Assert action failed due to missing env var
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when GITHUB_REPOSITORY is empty, got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed when GITHUB_REPOSITORY is missing"
